
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ama Your Love</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- START SCREEN -->
    <section id="startScreen" class="screen">

      <h1>Say something to your Ama</h1>

      <button class="seed" onclick="openLetterbox()"></button>

    </section>


    <!-- LETTERBOX SCREEN -->
    <section id="letterboxScreen" class="screen hidden">

      <h1>Write something for your Ama</h1>

      <div class="letterbox">

        <textarea
          id="messageInput"
          placeholder="Write your message..."
        ></textarea>

        <button class="send" onclick="sendMessage()">
          Send ♡
        </button>

      </div>

      <button class="back" onclick="goBack()">
        Back
      </button>

    </section>


    <!-- FLOATING MESSAGES -->
    <div id="messages"></div>

  </main>


<script>
function openLetterbox() {
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("letterboxScreen").classList.remove("hidden");
}

function goBack() {
  document.getElementById("letterboxScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
}

function getSavedMessages() {
  return JSON.parse(localStorage.getItem("amaMessages")) || [];
}

function saveMessages(messages) {
  localStorage.setItem("amaMessages", JSON.stringify(messages));
}

function deleteMessage(id) {
  const messages = getSavedMessages().filter(function(message) {
    return message.id !== id;
  });

  saveMessages(messages);

  const message = document.querySelector('.floating-message[data-id="' + id + '"]');
  if (message) message.remove();
}

function createMessage(message) {
  const wrapper = document.createElement("div");
  wrapper.className = "floating-message";
  wrapper.dataset.id = message.id;
  wrapper.style.left = message.x + "%";
  wrapper.style.top = message.y + "%";

  const text = document.createElement("span");
  text.textContent = message.text;

  const close = document.createElement("button");
  close.type = "button";
  close.textContent = "×";
  close.className = "delete-btn";
  close.addEventListener("click", function() {
    deleteMessage(message.id);
  });

  wrapper.appendChild(text);
  wrapper.appendChild(close);
  document.getElementById("messages").appendChild(wrapper);
}

function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  const message = {
    id: Date.now() + "-" + Math.random().toString(16).slice(2),
    text: text,
    x: Math.random() * 70 + 15,
    y: Math.random() * 70 + 15
  };

  const messages = getSavedMessages();
  messages.push(message);
  saveMessages(messages);

  createMessage(message);
  input.value = "";
}

function loadMessages() {
  const messages = getSavedMessages();
  messages.forEach(createMessage);
}

window.addEventListener("load", loadMessages);
</script>

</body>

</html>
