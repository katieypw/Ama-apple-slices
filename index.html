
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ama Your Love</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- START SCREEN -->
    <section id="startScreen" class="screen">

      <h1>Say something to your Ama</h1>

      <button class="seed" type="button"></button>

    </section>


    <!-- LETTERBOX SCREEN -->
    <section id="letterboxScreen" class="screen hidden">

      <h1>Write something for your Ama</h1>

      <div class="letterbox">

        <textarea
          id="messageInput"
          placeholder="Write your message..."
        ></textarea>

        <button class="send" type="button">
          Send ♡
        </button>

      </div>

      <button class="back" type="button">
        Back
      </button>

    </section>


    <!-- FLOATING MESSAGES -->
    <div id="messages"></div>

  </main>

  <button id="clearAllBtn" class="clear-all" type="button">Clear all</button>


<script>
function openLetterbox() {
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("letterboxScreen").classList.remove("hidden");
}

function goBack() {
  document.getElementById("letterboxScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
}

function getSavedMessages() {
  return JSON.parse(localStorage.getItem("amaMessages")) || [];
}

function saveMessages(messages) {
  localStorage.setItem("amaMessages", JSON.stringify(messages));
}

function updateClearAllButton() {
  const button = document.getElementById("clearAllBtn");
  const hasItems = getSavedMessages().length > 0;
  button.classList.toggle("hidden", !hasItems);
}

function deleteMessage(id) {
  const messages = getSavedMessages().filter(function(message) {
    return message.id !== id;
  });

  saveMessages(messages);

  const message = document.querySelector('.floating-message[data-id="' + id + '"]');
  if (message) {
    message.remove();
  }

  updateClearAllButton();
}

function clearAllMessages() {
  localStorage.removeItem("amaMessages");
  document.getElementById("messages").innerHTML = "";
  updateClearAllButton();
}

function getMessagePosition(index) {
  const isMobile = window.innerWidth <= 600;
  const column = index % 2;
  const row = Math.floor(index / 2);

  if (isMobile) {
    return {
      x: column === 0 ? 3 : 52,
      y: Math.min(8 + row * 18, 68)
    };
  }

  return {
    x: column === 0 ? 3 : 75,
    y: Math.min(10 + row * 18, 70)
  };
}

function createMessage(message, index) {
  const position = getMessagePosition(index);
  const wrapper = document.createElement("div");
  wrapper.className = "floating-message";
  wrapper.dataset.id = message.id;
  wrapper.style.left = position.x + "%";
  wrapper.style.top = position.y + "%";

  const text = document.createElement("span");
  text.textContent = message.text;

  const close = document.createElement("button");
  close.type = "button";
  close.textContent = "×";
  close.className = "delete-btn";
  close.setAttribute("aria-label", "Delete message");
  close.title = "Delete message";

  wrapper.appendChild(text);
  wrapper.appendChild(close);
  document.getElementById("messages").appendChild(wrapper);
}

function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  const message = {
    id: Date.now() + "-" + Math.random().toString(16).slice(2),
    text: text,
    x: Math.random() * 70 + 15,
    y: Math.random() * 70 + 15
  };

  const messages = getSavedMessages();
  messages.push(message);
  saveMessages(messages);

  createMessage(message, messages.length - 1);
  updateClearAllButton();
  input.value = "";
}

function loadMessages() {
  const messages = getSavedMessages();
  messages.forEach(createMessage);
  updateClearAllButton();
}

document.addEventListener("click", function(event) {
  const seedButton = event.target.closest(".seed");
  if (seedButton) {
    openLetterbox();
    return;
  }

  const sendButton = event.target.closest(".send");
  if (sendButton) {
    sendMessage();
    return;
  }

  const backButton = event.target.closest(".back");
  if (backButton) {
    goBack();
    return;
  }

  const clearButton = event.target.closest("#clearAllBtn");
  if (clearButton) {
    clearAllMessages();
    return;
  }

  const deleteButton = event.target.closest(".delete-btn");
  if (deleteButton) {
    event.preventDefault();
    event.stopPropagation();
    const message = deleteButton.closest(".floating-message");
    if (message) {
      deleteMessage(message.dataset.id);
    }
  }
});

window.addEventListener("load", loadMessages);
</script>

</body>

</html>
