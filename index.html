
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ama Your Love</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- START SCREEN -->
    <section id="startScreen" class="screen">

      <h1>Say something to your Ama</h1>

      <button class="seed" onclick="openLetterbox()"></button>

    </section>


    <!-- LETTERBOX SCREEN -->
    <section id="letterboxScreen" class="screen hidden">

      <h1>Write something for your Ama</h1>

      <div class="letterbox">

        <textarea
          id="messageInput"
          placeholder="Write your message..."
        ></textarea>

        <button class="send" onclick="sendMessage()">
          Send ♡
        </button>

      </div>

      <button class="back" onclick="goBack()">
        Back
      </button>

    </section>


    <!-- FLOATING MESSAGES -->
    <div id="messages"></div>

  </main>


<script>

/* Open the letterbox */
function openLetterbox() {
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("letterboxScreen").classList.remove("hidden");
}


/* Go back to the seed */
function goBack() {
  document.getElementById("letterboxScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
}


/* Read messages from local storage */
function getSavedMessages() {
  const savedMessages = JSON.parse(localStorage.getItem("amaMessages")) || [];

  return savedMessages
    .map(function(message, index) {
      return {
        id: message.id || "message-" + index,
        text: String(message.text || "").trim(),
        x: Number(message.x ?? 50),
        y: Number(message.y ?? 50)
      };
    })
    .filter(function(message) {
      return message.text !== "";
    });
}


/* Save messages to local storage */
function saveMessages(messages) {
  localStorage.setItem("amaMessages", JSON.stringify(messages));
}


/* Remove a message from the screen and storage */
function deleteMessage(id) {
  const updatedMessages = getSavedMessages().filter(function(message) {
    return message.id !== id;
  });

  saveMessages(updatedMessages);

  const messageToRemove = Array.from(
    document.querySelectorAll(".floating-message")
  ).find(function(message) {
    return message.dataset.id === id;
  });

  if (messageToRemove) {
    messageToRemove.remove();
  }
}


/* Create one floating message */
function createMessage(messageData) {

  const message = document.createElement("div");

  message.className = "floating-message";
  message.dataset.id = messageData.id;
  message.textContent = messageData.text;

  message.style.left = messageData.x + "%";
  message.style.top = messageData.y + "%";

  /* Give every message slightly different movement */

  message.style.setProperty(
    "--x",
    (Math.random() * 30 - 15) + "px"
  );

  message.style.setProperty(
    "--y",
    (Math.random() * 30 - 15) + "px"
  );

  message.style.setProperty(
    "--speed",
    (Math.random() * 4 + 5) + "s"
  );

  message.style.setProperty(
    "--rotation",
    (Math.random() * 8 - 4) + "deg"
  );

  const deleteButton = document.createElement("button");
  deleteButton.type = "button";
  deleteButton.className = "delete-btn";
  deleteButton.setAttribute("aria-label", "Delete message");
  deleteButton.textContent = "×";

  deleteButton.addEventListener("mousedown", function(event) {
    event.stopPropagation();
  });

  deleteButton.addEventListener("click", function(event) {
    event.preventDefault();
    event.stopPropagation();
    deleteMessage(messageData.id);
  });

  message.appendChild(deleteButton);
  document.getElementById("messages").appendChild(message);
}


/* Send a new message */
function sendMessage() {

  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (text === "") {
    return;
  }


  /* Choose a position */

  const x = Math.random() * 70 + 15;
  const y = Math.random() * 70 + 15;
  const messageId = Date.now() + "-" + Math.random().toString(16).slice(2);
  const messageData = {
    id: messageId,
    text: text,
    x: x,
    y: y
  };


  /* Show the message */

  createMessage(messageData);


  /* Save the new message */

  const messages = getSavedMessages();
  messages.push(messageData);
  saveMessages(messages);


  /* Clear the text box */

  input.value = "";
}


/* Load saved messages when the website opens */

function loadMessages() {

  const messages = getSavedMessages();

  messages.forEach(function(message) {
    createMessage(message);
  });
}


/* Run when the page loads */

window.addEventListener("load", loadMessages);

</script>



</body>

</html>
