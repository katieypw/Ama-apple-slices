
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ama Your Love</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- START SCREEN -->
    <section id="startScreen" class="screen">

      <h1>Say something to your Ama</h1>

      <button class="seed" type="button"></button>

    </section>


    <!-- LETTERBOX SCREEN -->
    <section id="letterboxScreen" class="screen hidden">

      <h1>Write something for your Ama</h1>

      <div class="letterbox">

        <textarea
          id="messageInput"
          placeholder="Write your message..."
        ></textarea>

        <button class="send" type="button">
          Send ♡
        </button>

      </div>

      <button class="back" type="button">
        Back
      </button>

    </section>


    <!-- FLOATING MESSAGES -->
    <div id="messages"></div>

  </main>

  <button id="clearAllBtn" class="clear-all hidden" type="button">Clear all</button>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  remove,
  onValue
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiVagzCjP3QbQTBnZScU9-t0Z5bTB6TaQ",
  authDomain: "ama-apple-slices-632d6.firebaseapp.com",
  databaseURL: "https://ama-apple-slices-632d6-default-rtdb.firebaseio.com",
  projectId: "ama-apple-slices-632d6",
  storageBucket: "ama-apple-slices-632d6.firebasestorage.app",
  messagingSenderId: "1066071276007",
  appId: "1:1066071276007:web:9fc64cd0b050523f04a542"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const messagesRef = ref(database, "messages");

function openLetterbox() {
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("letterboxScreen").classList.remove("hidden");
}

function goBack() {
  document.getElementById("letterboxScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
}

let savedMessages = [];

function updateClearAllButton() {
  const button = document.getElementById("clearAllBtn");
  button.classList.toggle("hidden", savedMessages.length === 0);
}

async function deleteMessage(id) {
  await remove(ref(database, "messages/" + id));
}

async function clearAllMessages() {
  await remove(messagesRef);
}

function getMessagePosition(index) {
  const isMobile = window.innerWidth <= 600;
  const column = index % 2;
  const row = Math.floor(index / 2);

  if (isMobile) {
    return {
      x: column === 0 ? 3 : 52,
      y: Math.min(8 + row * 18, 68)
    };
  }

  return {
    x: column === 0 ? 3 : 75,
    y: Math.min(10 + row * 18, 70)
  };
}

function createMessage(message, index) {
  const position = getMessagePosition(index);
  const wrapper = document.createElement("div");
  wrapper.className = "floating-message";
  wrapper.dataset.id = message.id;
  wrapper.style.left = position.x + "%";
  wrapper.style.top = position.y + "%";

  const text = document.createElement("span");
  text.textContent = message.text;

  const close = document.createElement("button");
  close.type = "button";
  close.textContent = "×";
  close.className = "delete-btn";
  close.setAttribute("aria-label", "Delete message");
  close.title = "Delete message";

  wrapper.appendChild(text);
  wrapper.appendChild(close);
  document.getElementById("messages").appendChild(wrapper);
}

async function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  await push(messagesRef, { text: text });
  input.value = "";
}

function renderMessages() {
  document.getElementById("messages").innerHTML = "";
  savedMessages.forEach(createMessage);
  updateClearAllButton();
}

async function loadMessages() {
  onValue(messagesRef, function(snapshot) {
    savedMessages = [];
    snapshot.forEach(function(child) {
      savedMessages.push({
        id: child.key,
        text: child.val().text
      });
    });
    renderMessages();
  });
}

document.addEventListener("click", function(event) {
  const seedButton = event.target.closest(".seed");
  if (seedButton) {
    openLetterbox();
    return;
  }

  const sendButton = event.target.closest(".send");
  if (sendButton) {
    sendMessage();
    return;
  }

  const backButton = event.target.closest(".back");
  if (backButton) {
    goBack();
    return;
  }

  const clearButton = event.target.closest("#clearAllBtn");
  if (clearButton) {
    clearAllMessages();
    return;
  }

  const deleteButton = event.target.closest(".delete-btn");
  if (deleteButton) {
    event.preventDefault();
    event.stopPropagation();
    const message = deleteButton.closest(".floating-message");
    if (message) {
      deleteMessage(message.dataset.id);
    }
  }
});

window.addEventListener("load", function() {
  loadMessages();
});
</script>

</body>

</html>
